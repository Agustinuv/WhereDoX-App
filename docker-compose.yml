services:
  # Local Postgres so the project runs end to end without cloud credentials.
  # Point DATABASE_URL at Supabase instead and this service can simply be left down.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wheredox
      POSTGRES_PASSWORD: wheredox
      POSTGRES_DB: wheredox
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheredox -d wheredox"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/srv
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Chat-style client. The browser only ever talks to this origin; Next proxies /api/*
  # to the backend server-side, which is why FastAPI needs no CORS configuration.
  web:
    build:
      context: ./frontend
      # Baked at build time: Next resolves rewrites into its routes manifest.
      args:
        BACKEND_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  db_data:
